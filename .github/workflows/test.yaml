name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
      - run: |
          go test \
            -race \
            -coverprofile=coverage.txt \
            -covermode=atomic \
            $(go list ./... | grep --invert-match mocks)
      - uses: codecov/codecov-action@v5
